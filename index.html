<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itz Fizz | Scroll Car Animation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- hero: this section gets pinned while the car drives across -->
  <section class="hero" id="hero">

    <h1 class="headline" id="headline">WELCOME ITZ FIZZ</h1>

    <div class="track">
      <div class="road-lines" id="roadLines"></div>
      <img class="car" id="car" src="assets/car.svg" alt="Top view of a sports car">
    </div>

    <div class="stats" id="stats">
      <div class="stat">
        <h2>58%</h2>
        <p>Increase in pick up point use</p>
      </div>
      <div class="stat">
        <h2>23%</h2>
        <p>Decreased in customer phone calls</p>
      </div>
      <div class="stat">
        <h2>27%</h2>
        <p>Increase in pick up point use</p>
      </div>
      <div class="stat">
        <h2>40%</h2>
        <p>Decreased in customer phone calls</p>
      </div>
    </div>

  </section>

  <!-- extra section so the page has something after the hero -->
  <section class="after">
    <p>Scroll back up to watch it drive again.</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
